<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYNTHETIC HA dashboard contract preview</title>
<style>
:root{font-family:system-ui;color:#263440;background:#f4f6f8;--primary-text-color:#263440;--secondary-text-color:#647585;--card-background-color:#fff;--divider-color:#e1e7ed;--primary-color:#007ac2}
body{margin:0}header{padding:12px 24px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:2}header strong{display:block;margin-bottom:10px}nav{display:flex;gap:12px}button{padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}button[aria-current=true]{border-color:#007ac2;color:#007ac2}main{max-width:1400px;margin:auto;padding:18px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.tiles button{text-align:left}.tiles b{display:block;font-size:20px;margin-top:8px}.history{background:#fff;padding:18px;border:1px solid #ddd;border-radius:12px}dialog{max-width:90vw;border:1px solid #ddd;border-radius:12px}#result{color:#007ac2}@media(max-width:620px){.tiles{grid-template-columns:1fr 1fr}main{padding:10px}nav{gap:4px}}
</style>
<header><strong>SYNTHETIC HA-contract preview · fixtures only · HA built-in cards simulated</strong><nav id="tabs"></nav><button id="update">Simulate incoming EV sensor update → 57%</button><span id="result" role="status"></span></header>
<style>#cards{user-select:none;-webkit-user-select:none}</style>
<style>:root.synthetic-dark{color:#eee;background:#111;--primary-text-color:#eee;--secondary-text-color:#aaa;--card-background-color:#1c1c1c;--divider-color:#393939;--primary-color:#36b8ee}:root.synthetic-dark header,:root.synthetic-dark button{color:#eee;background:#1c1c1c;border-color:#393939}</style>
<label>SYNTHETIC theme <select id="preview-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label>SYNTHETIC gesture target <select id="gesture-target"><option value="power">Power</option><option value="soc">SoC</option></select></label>
<button data-gesture="pinch-out">Replay pinch out</button><button data-gesture="pinch-in">Replay pinch in</button><button data-gesture="pan">Replay two-finger pan</button>
<button id="timeout">Simulate request timeout</button><button id="recover">Restore requests</button>
<label>SYNTHETIC EV display <select id="ev-scenario"><option value="sampled">Sampled fixture</option><option value="charging">Charging · 3 phases</option><option value="negative">Startup · negative meter</option><option value="phase_switch">Phase transition · 1 → 3</option><option value="settling">Restart hold · 30 seconds</option><option value="fault">Delivery fault</option><option value="device_fault">Reported charger error</option><option value="stopped">Normal forced stop</option><option value="stale">Stale readings</option><option value="disconnected">Disconnected</option></select></label>
<main id="cards"></main><dialog id="history"><h2>HA more-info event received</h2><p id="entity"></p><p>Sensor history is supplied by HA Recorder in the actual dashboard. No historical measurements are fabricated here.</p><button id="close">Close sensor history</button></dialog>
<label>SYNTHETIC monthly peak <select id="peak-scenario"><option value="2500">2500 W</option><option value="7500">7500 W</option><option value="0">0 W</option><option value="unavailable">Unavailable</option></select></label>
<script type="module">
await import('/ha-card.js');
document.querySelector('#preview-theme').onchange=event=>document.documentElement.classList.toggle('synthetic-dark',event.target.value==='dark');
const socket = new WebSocket(`ws://${location.host}/api/websocket`);
await new Promise(resolve => socket.addEventListener('open',resolve,{once:true}));
let id=0;
const pending=new Map();
socket.onmessage=event=>{const message=JSON.parse(event.data);pending.get(message.id)(message.result);pending.delete(message.id)};
const hass={connection:socket,user:{is_admin:true},states:{},callWS(message){return new Promise(resolve=>{const key=++id;pending.set(key,resolve);socket.send(JSON.stringify({...message,id:key}))})}};
hass.states=await hass.callWS({type:'synthetic/states'});
hass.callService=async(domain,service,data)=>{
  hass.states=await hass.callWS({type:'synthetic/phase',domain,service,data});
  document.querySelector('#result').textContent=`SYNTHETIC HA action only: ${domain}.${service} ${data.entity_id} → ${data.option}`;
  update();
};
const strategy=customElements.get('ll-strategy-dashboard-energymanager');
const config=await strategy.generate({type:'custom:energymanager'},hass);
let components=[];
function show(path){
  const view=config.views.find(item=>item.path===path)||config.views[0];
  document.querySelector('#cards').replaceChildren();components=[];
  for(const button of document.querySelectorAll('[data-view]'))button.setAttribute('aria-current',String(button.dataset.view===view.path));
  history.replaceState(null,'',`/native-preview/${view.path}`);
  for(const section of view.sections){
    const container=document.createElement('div');container.className=section.cards.some(card=>card.type==='tile')?'tiles':'';
    document.querySelector('#cards').append(container);
    for(const card of section.cards){
      if(card.type==='tile'){
        const button=document.createElement('button');button.dataset.entity=card.entity;
        button.onclick=()=>window.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:card.entity}}));
        container.append(button);components.push({tile:button,config:card});
      }else if(card.type==='history-graph'){
        const label=document.createElement('p');label.className='history';label.textContent=`Native HA ${card.title} · ${card.hours_to_show} hours · ${card.entities.join(', ')}`;container.append(label);
      }else{
        const component=document.createElement(card.type.slice(7));component.setConfig(card);component.hass=hass;container.append(component);components.push({element:component});
      }
    }
  }
  update();
}
function update(){for(const item of components){if(item.element)item.element.hass={...hass,states:{...hass.states}};else{const entity=hass.states[item.config.entity];item.tile.replaceChildren(document.createTextNode(item.config.name));const value=document.createElement('b');value.textContent=`${entity?.state??'unavailable'} ${entity?.attributes.unit_of_measurement||''}`;item.tile.append(value)}}}
// Synthetic integration replay only: the browser's physical touch/capture negotiation is not tested.
function replayGesture(kind) {
  const name=document.querySelector('#gesture-target').value;
  const plot=components.map(item=>item.element?.shadowRoot?.querySelector(`#${name}`)).find(Boolean);
  if (!plot) throw new Error('Open Overview before replaying a graph gesture');
  const box=plot.querySelector('svg').getBoundingClientRect(), left=box.left+58, width=box.width-74;
  const originals=new Map(), captures=new Set();
  const methods={setPointerCapture:id=>captures.add(id),hasPointerCapture:id=>captures.has(id),releasePointerCapture:id=>captures.delete(id)};
  for (const [key,method] of Object.entries(methods)) {
    originals.set(key,Object.getOwnPropertyDescriptor(plot,key));
    Object.defineProperty(plot,key,{value:method,configurable:true});
  }
  const send=(type,id,fraction)=>plot.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,
    pointerType:'touch',pointerId:id,isPrimary:id===1001,button:0,buttons:type==='pointerup'?0:1,
    clientX:left+width*fraction,clientY:box.top+box.height/2}));
  try {
    send('pointerdown',1001,0.3); send('pointerdown',1002,0.7);
    const positions=kind==='pinch-out'?[0.2,0.8]:kind==='pinch-in'?[0.4,0.6]:[0.4,0.8];
    send('pointermove',1001,positions[0]); send('pointermove',1002,positions[1]);
    send('pointerup',1001,positions[0]); send('pointerup',1002,positions[1]);
  } finally {
    for (const [key,descriptor] of originals) {
      if (descriptor) Object.defineProperty(plot,key,descriptor); else delete plot[key];
    }
  }
  document.querySelector('#result').textContent='Synthetic pointer replay complete; capture mocked, not a physical touch test';
}
for (const button of document.querySelectorAll('[data-gesture]')) button.onclick=()=>replayGesture(button.dataset.gesture);
for(const view of config.views){const button=document.createElement('button');button.dataset.view=view.path;button.textContent=view.title;button.onclick=()=>show(view.path);document.querySelector('#tabs').append(button)}
document.querySelector('#update').onclick=async()=>{hass.states=await hass.callWS({type:'synthetic/ev_update'});update();document.querySelector('#result').textContent='Incoming HA state delivered';};
document.querySelector('#peak-scenario').onchange=async event=>{hass.states=await hass.callWS({type:'synthetic/peak_update',value:event.target.value});update();};
document.querySelector('#ev-scenario').onchange=async event=>{hass.states=await hass.callWS({type:'synthetic/ev_scenario',scenario:event.target.value});update();document.querySelector('#result').textContent='SYNTHETIC EV display projection; no actuator changes';};
for(const [id,fail] of [['timeout',true],['recover',false]]) document.querySelector(`#${id}`).onclick=async()=>{await hass.callWS({type:'synthetic/requests',fail});document.querySelector('#result').textContent=fail?'SYNTHETIC request delay enabled':'SYNTHETIC requests restored';};
window.addEventListener('hass-more-info',event=>{document.querySelector('#entity').textContent=event.detail.entityId;document.querySelector('#history').showModal()});
window.addEventListener('location-changed',()=>show(location.pathname.split('/').at(-1)));
document.querySelector('#close').onclick=()=>document.querySelector('#history').close();
show(location.pathname.split('/').at(-1));
</script></html>
