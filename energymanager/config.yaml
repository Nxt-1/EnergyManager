name: Energy Manager
version: "4.3.19"
slug: energy_manager
description: Joint EV/ESS planning and responsive control for Home Assistant
url: https://github.com/Nxt-1/EnergyManager
arch:
  - amd64
startup: application
boot: manual
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant
panel_admin: true
image: ghcr.io/nxt-1/energymanager
map:
  - type: app_config
    read_only: false
options:
  mode: demo
  planning_budget_seconds: 120
  configuration_file: /config/energymanager.json
schema:
  mode: list(demo|configured)
  planning_budget_seconds: int(10,600)
  configuration_file: str
