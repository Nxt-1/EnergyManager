name: Energy Manager
version: "0.10.2"
slug: energy_manager
description: Predictive home energy manager for Home Assistant
url: https://github.com/Nxt-1/EnergyManager
arch:
  - amd64
startup: application
boot: auto
stage: experimental
homeassistant_api: true
image: ghcr.io/nxt-1/energymanager
options:
  log_level: info
  grid: {}
  ess:
    power_positive_means: discharge
  pv: {}
  ev: {}
  database:
    enabled: false
    database: energy_manager
  legacy_influx:
    backfill_enabled: false
    database: home_assistant
    retention_policy: autogen
schema:
  log_level: list(debug|info|warning|error)
  grid:
    import_power_entity: str?
    export_power_entity: str?
  ess:
    soc_entity: str?
    power_entity: str?
    power_positive_means: list(discharge|charge)
  pv:
    solax_power_entity: str?
    shed_power_entity: str?
    forecast_enabled: bool?
  ev:
    soc_entity: str?
    connected_entity: str?
    charging_power_entity: str?
  database:
    enabled: bool
    url: url?
    database: str
    token: password?
  legacy_influx:
    backfill_enabled: bool
    url: url?
    database: str
    retention_policy: str
    username: str?
    password: password?
