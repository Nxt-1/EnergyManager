configuration:
  log_level:
    name: Log level
    description: Logging detail written to the Energy Manager app log.
  grid:
    name: Grid
    description: P1 momentary grid measurements.
    fields:
      import_power_entity:
        name: Import power entity
        description: Home Assistant entity ID for momentary grid import power in W or kW.
      export_power_entity:
        name: Export power entity
        description: Home Assistant entity ID for momentary grid export power in W or kW.
  ess:
    name: ESS
    description: Battery/ESS measurements used to build the canonical house state.
    fields:
      soc_entity:
        name: SoC entity
        description: Home Assistant entity ID for ESS state of charge in percent.
      power_entity:
        name: Power entity
        description: Home Assistant entity ID for ESS power in W or kW.
      power_positive_means:
        name: Positive ESS power means
        description: Select how positive values from the configured ESS power entity should be interpreted.
      capacity_kwh:
        name: ESS nominal capacity
        description: Nominal battery capacity in kWh used by the shadow planner. Defaults to 15 kWh when omitted.
      min_soc_percent:
        name: Minimum planning SoC
        description: Lower SoC reserve used by the shadow planner. Defaults to 10 percent when omitted.
      max_soc_percent:
        name: Maximum planning SoC
        description: Upper SoC limit used by the shadow planner. Defaults to 100 percent when omitted.
      max_charge_power_w:
        name: Maximum planning charge power
        description: Aggregate battery charging limit in W used by the shadow planner. Defaults to 2000 W when omitted.
      max_discharge_power_w:
        name: Maximum planning discharge power
        description: ESS AC discharge/inverter limit in W used by the shadow planner. Defaults to 2000 W when omitted.
      charge_efficiency:
        name: Planning charge efficiency
        description: Fraction from 0 to 1 retained while charging. Defaults to 0.95 when omitted.
      discharge_efficiency:
        name: Planning discharge efficiency
        description: Fraction from 0 to 1 delivered while discharging. Defaults to 0.95 when omitted.
  pv:
    name: PV
    description: Separate PV production measurements. Total PV is derived from the configured inputs.
    fields:
      solax_power_entity:
        name: Solax PV power entity
        description: Home Assistant entity ID for AC-coupled Solax PV power in W or kW.
      shed_power_entity:
        name: Shed PV power entity
        description: Home Assistant entity ID for shed/Victron MPPT PV power in W or kW.
      forecast_enabled:
        name: Enable PV forecast
        description: Run the built-in four-plane Open-Meteo PV predictor. Enabled by default if omitted.
  ev:
    name: EV
    description: Vehicle and charging measurements.
    fields:
      soc_entity:
        name: EV SoC entity
        description: Home Assistant entity ID for vehicle state of charge in percent.
      connected_entity:
        name: EV connected entity
        description: Home Assistant entity ID indicating whether the vehicle is connected/plugged in.
      charging_power_entity:
        name: EV charging power entity
        description: Home Assistant entity ID for present EV charging power in W or kW.
      min_charge_current_a:
        name: Minimum EV charge current
        description: Minimum controllable charging current in A. Defaults to 6 A when omitted.
      max_charge_current_a:
        name: Maximum EV charge current
        description: Maximum vehicle/EVSE charging current per phase in A. Defaults to 16 A when omitted.
      nominal_voltage_v:
        name: EV nominal phase voltage
        description: Nominal phase-to-neutral voltage used for planning power limits. Defaults to 230 V when omitted.
      supports_single_phase:
        name: EV supports single-phase charging
        description: Allow the EV actuator to expose single-phase charging as a planner capability.
      supports_three_phase:
        name: EV supports three-phase charging
        description: Allow the EV actuator to expose three-phase charging as a planner capability.
      battery_capacity_kwh:
        name: EV usable battery capacity
        description: Usable vehicle battery capacity in kWh used to convert SoC targets into charging energy.
      charge_efficiency:
        name: EV charging efficiency
        description: Fraction from 0 to 1 of AC charging energy stored in the vehicle battery. Defaults to 0.90.
      target_soc_percent:
        name: EV target SoC
        description: Target state of charge used by the target-by-departure task. Defaults to 80 percent.
      departure_time_local:
        name: EV departure time
        description: Local target-by-departure time in 24-hour HH:MM format. Defaults to 07:00.

  database:
    name: Database
    description: Optional InfluxDB 3 long-term persistence for Energy Manager history and forecast revisions.
    fields:
      enabled:
        name: Enable database persistence
        description: Store Energy Manager time-series history in InfluxDB 3 instead of relying on local JSONL files.
      url:
        name: InfluxDB URL
        description: Base URL of the InfluxDB 3 server, for example http://192.168.178.103:8181.
      database:
        name: Database name
        description: InfluxDB 3 database used by Energy Manager.
      token:
        name: Database token
        description: Restricted InfluxDB 3 token with read and write access to the configured database.
  legacy_influx:
    name: Legacy HA InfluxDB backfill
    description: Incrementally import only historical Home Assistant signals used by EnergyManager.
    fields:
      backfill_enabled:
        name: Enable legacy history backfill
        description: Reconstruct historical house/background load once from the configured legacy InfluxDB source.
      url:
        name: Legacy InfluxDB URL
        description: Base URL of the old Home Assistant InfluxDB 1.x server, for example http://192.168.178.103:8086.
      database:
        name: Legacy database name
        description: Home Assistant database in the old InfluxDB instance. Usually home_assistant.
      retention_policy:
        name: Legacy retention policy
        description: Retention policy containing the Home Assistant measurements. Usually autogen.
      username:
        name: Legacy InfluxDB username
        description: Read-only InfluxDB 1.x username used to query the old Home Assistant history.
      password:
        name: Legacy InfluxDB password
        description: Password for the configured legacy InfluxDB 1.x user.
