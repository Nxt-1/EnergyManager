configuration:
  mode:
    name: Input mode
    description: Demo uses explicitly synthetic local signals. Configured reads the reviewed V4 JSON file; control remains disabled unless explicitly commissioned there.
  planning_budget_seconds:
    name: Planning budget (seconds)
    description: Total budget for one full seven-day planning cycle, including comparisons and validation.
  configuration_file:
    name: V4 configuration file
    description: Absolute path in the read-only app configuration folder. V3 options and databases are not automatically imported.
