[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "energymanager"
version = "4.4.9"
description = "Joint EV/ESS planning and independent local control"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.13.3", "highspy==1.15.1", "numpy==2.4.2", "tzdata==2026.2", "icalendar==7.3.0", "recurring-ical-events==3.8.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.14", "mypy==1.19.1", "build==1.4.0", "jsbeautifier==1.15.4"]

[project.scripts]
energymanager = "energymanager.__main__:main"

[tool.setuptools.package-data]
energymanager = ["assets/*", "defaults/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
