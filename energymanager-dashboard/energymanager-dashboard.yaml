# EnergyManager dashboard v1.6 — planned load areas and ESS source estimate
title: EnergyManager
views:
- title: Overview
  path: overview
  icon: mdi:view-dashboard
  cards:
  - type: custom:energymanager-timeline-card
    entity: sensor.energy_manager_plan_timeline
    title: Scheduled tasks · next 24 h
    hours: 24
  - type: grid
    columns: 3
    square: false
    cards:
    - type: tile
      entity: sensor.energy_manager_grid_power
      name: Grid net
    - type: tile
      entity: sensor.energy_manager_pv_total_power
      name: PV combined
    - type: tile
      entity: sensor.energy_manager_house_load_power
      name: House load
    - type: tile
      entity: sensor.energy_manager_ess_soc
      name: ESS SoC
    - type: tile
      entity: sensor.energy_manager_ev_soc
      name: EV SoC
    - type: tile
      entity: sensor.energy_manager_ev_charging_power
      name: EV charging
  - type: custom:apexcharts-card
    header:
      show: true
      title: Power · planned next 24 h
      show_states: false
    graph_span: 24h
    span:
      start: minute
    now:
      show: true
      label: Now
    update_interval: 1min
    apex_config:
      chart:
        height: 300
        toolbar:
          show: false
        stacked: false
      grid:
        borderColor: var(--divider-color)
      legend:
        show: true
        showForSingleSeries: true
      tooltip:
        shared: true
        intersect: false
      xaxis:
        type: datetime
      yaxis:
        decimalsInFloat: 0
        title:
          text: W
      stroke:
        curve: straight
        dashArray:
        - 0
        - 0
        - 6
        - 6
        - 6
        - 6
        - 6
        - 6
        - 6
        - 8
        width:
        - 0
        - 0
        - 2
        - 3
        - 3
        - 3
        - 3
        - 3
        - 2
        - 1
      fill:
        opacity:
        - 0.56
        - 0.92
        - 1
        - 1
        - 1
        - 1
        - 1
        - 1
        - 1
        - 1
    series:
    - entity: sensor.energy_manager_plan_day_1
      name: Load (total)
      type: area
      stroke_width: 0
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.load_w)]);
      color: '#60a5fa'
      opacity: 0.8
    - entity: sensor.energy_manager_plan_day_1
      name: Background
      type: area
      stroke_width: 0
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.background_w
        ?? p.load_w)]);
      color: '#94a3b8'
      opacity: 0.8
    - entity: sensor.energy_manager_plan_day_1
      name: AC solar
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.pv_ac_w)]);
      color: '#eab308'
    - entity: sensor.energy_manager_plan_day_1
      name: Grid
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.grid_w)]);
      color: '#ef4444'
    - entity: sensor.energy_manager_plan_day_1
      name: ESS · battery
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: 'const a = entity.attributes.intervals || [];

        const bucket = p => { const ess = Number(p.ess_w) || 0; if (ess <= 0) return -1; const ratio = Math.min(1, Math.max(0,
        (Number(p.pv_dc_w) || 0) / ess)); return Math.min(4, Math.floor(ratio * 5)); };

        return a.map((p, i) => [new Date(p.start).getTime(), (bucket(p) === 0 || (i > 0 && bucket(a[i - 1]) === 0)) ?
        Math.max(0, Number(p.ess_w) || 0) : null]);'
      color: '#2563eb'
    - entity: sensor.energy_manager_plan_day_1
      name: ESS · mostly battery
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: 'const a = entity.attributes.intervals || [];

        const bucket = p => { const ess = Number(p.ess_w) || 0; if (ess <= 0) return -1; const ratio = Math.min(1, Math.max(0,
        (Number(p.pv_dc_w) || 0) / ess)); return Math.min(4, Math.floor(ratio * 5)); };

        return a.map((p, i) => [new Date(p.start).getTime(), (bucket(p) === 1 || (i > 0 && bucket(a[i - 1]) === 1)) ?
        Math.max(0, Number(p.ess_w) || 0) : null]);'
      color: '#548bc4'
    - entity: sensor.energy_manager_plan_day_1
      name: ESS · mixed
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: 'const a = entity.attributes.intervals || [];

        const bucket = p => { const ess = Number(p.ess_w) || 0; if (ess <= 0) return -1; const ratio = Math.min(1, Math.max(0,
        (Number(p.pv_dc_w) || 0) / ess)); return Math.min(4, Math.floor(ratio * 5)); };

        return a.map((p, i) => [new Date(p.start).getTime(), (bucket(p) === 2 || (i > 0 && bucket(a[i - 1]) === 2)) ?
        Math.max(0, Number(p.ess_w) || 0) : null]);'
      color: '#817f98'
    - entity: sensor.energy_manager_plan_day_1
      name: ESS · mostly MPPT
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: 'const a = entity.attributes.intervals || [];

        const bucket = p => { const ess = Number(p.ess_w) || 0; if (ess <= 0) return -1; const ratio = Math.min(1, Math.max(0,
        (Number(p.pv_dc_w) || 0) / ess)); return Math.min(4, Math.floor(ratio * 5)); };

        return a.map((p, i) => [new Date(p.start).getTime(), (bucket(p) === 3 || (i > 0 && bucket(a[i - 1]) === 3)) ?
        Math.max(0, Number(p.ess_w) || 0) : null]);'
      color: '#64a878'
    - entity: sensor.energy_manager_plan_day_1
      name: ESS · MPPT
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: 'const a = entity.attributes.intervals || [];

        const bucket = p => { const ess = Number(p.ess_w) || 0; if (ess <= 0) return -1; const ratio = Math.min(1, Math.max(0,
        (Number(p.pv_dc_w) || 0) / ess)); return Math.min(4, Math.floor(ratio * 5)); };

        return a.map((p, i) => [new Date(p.start).getTime(), (bucket(p) === 4 || (i > 0 && bucket(a[i - 1]) === 4)) ?
        Math.max(0, Number(p.ess_w) || 0) : null]);'
      color: '#16a34a'
    - entity: sensor.energy_manager_plan_day_1
      name: Peak (15 min)
      type: line
      stroke_width: 1
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), (Number(hass.states['sensor.energy_manager_capacity_tariff_status']?.attributes?.observed_peak_kw)
        || 0) * 1000]);
      color: '#dc2626'
  - type: markdown
    content: 'ESS line color: **blue = battery-dominant**, **green = MPPT-dominant** (estimated from forecast MPPT and
      ESS AC output; not measured power-path attribution). AC solar is shown separately. Solid areas show background
      and EV charging; grid/ESS/solar are dashed lines.'
  - type: custom:apexcharts-card
    header:
      show: true
      title: Battery SoC · next 24 h
      show_states: false
    graph_span: 24h
    span:
      start: minute
    now:
      show: true
      label: Now
    update_interval: 1min
    apex_config:
      chart:
        height: 240
        toolbar:
          show: false
      grid:
        borderColor: var(--divider-color)
      legend:
        show: true
        showForSingleSeries: true
      tooltip:
        shared: true
      xaxis:
        type: datetime
      yaxis:
        decimalsInFloat: 0
    series:
    - entity: sensor.energy_manager_plan_day_1
      name: ESS SoC
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ess_soc)]);
    - entity: sensor.energy_manager_plan_day_1
      name: EV SoC
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ev_soc)]);
    yaxis:
    - min: 0
      max: 100
      decimals: 0
  - type: entities
    title: Next 24 h
    show_header_toggle: false
    entities:
    - entity: sensor.energy_manager_shadow_plan_next_24_hours_grid_import_energy
      name: Grid import
    - entity: sensor.energy_manager_shadow_plan_next_24_hours_net_deficit_energy
      name: Net deficit
    - entity: sensor.energy_manager_background_load_forecast_next_24_hours_energy
      name: Background load
    - entity: sensor.energy_manager_pv_forecast_tomorrow_energy
      name: Tomorrow's PV
