    - type: custom:energymanager-day-chart
      grid_options:
        columns: full
        rows: auto
      header:
        show: true
        title: Power · actual / planned · 06:00–06:00
        show_states: false
      graph_span: 24h
      span:
        start: minute
      now:
        show: true
        label: Now
      apex_config:
        chart:
          height: 450
          toolbar:
            show: false
          stacked: false
        grid:
          borderColor: var(--divider-color)
        legend:
          show: true
          showForSingleSeries: true
        tooltip:
          shared: true
          intersect: false
          custom: "EVAL:function ({seriesIndex, dataPointIndex, w}) {\n  // Mixed 5-minute HA history and 15-minute forecasts\
            \ have unequal X values.\n  // Build one tooltip from the closest available point in every visible series.\n \
            \ const xValues = w.globals.seriesX || [];\n  const yValues = w.globals.series || [];\n  const time = Number(xValues[seriesIndex]?.[dataPointIndex]);\n\
            \  if (!Number.isFinite(time)) return '';\n\n  const hidden = new Set(w.globals.collapsedSeriesIndices || []);\n\
            \  const maxSkewMs = 8 * 60 * 1000; // Half of a 15-minute interval, rounded up.\n  const nearest = i => {\n \
            \   const xs = xValues[i] || [];\n    const ys = yValues[i] || [];\n    let best = null;\n    let bestDistance\
            \ = maxSkewMs + 1;\n    for (let j = 0; j < xs.length; j++) {\n      if (ys[j] === null || ys[j] === undefined)\
            \ continue;\n      const x = Number(xs[j]);\n      const y = Number(ys[j]);\n      const distance = Math.abs(x\
            \ - time);\n      if (Number.isFinite(x) && Number.isFinite(y) && distance < bestDistance) {\n        best = y;\n\
            \        bestDistance = distance;\n      }\n    }\n    return best;\n  };\n  const escape = text => String(text).replace(/[&<>\"\
            ']/g, c => ({\n    '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;'\n  }[c]));\n\n  const\
            \ entries = [];\n  // List the supply components in physical stacking order in the hover panel.\n  const displayOrder\
            \ = [2, 1, 0, 3, 4, 5];\n  for (const i of displayOrder) {\n    if (hidden.has(i)) continue;\n    let value =\
            \ nearest(i);\n    if (value === null) continue;\n    // Supply curves are drawn cumulatively, but labels show\
            \ component power.\n    if (i === 0 || i === 1) {\n      const lower = nearest(i + 1);\n      if (lower === null)\
            \ continue;\n      value -= lower;\n    }\n    const name = escape(w.config.series[i].name || `Series ${i + 1}`);\n\
            \    const color = (w.globals.colors || [])[i] || '#888';\n    entries.push(`<div style=\"display:flex;align-items:center;gap:8px;justify-content:space-between;`\
            \ +\n      `margin-top:5px\"><span style=\"display:flex;align-items:center;gap:6px\">` +\n      `<span style=\"\
            width:9px;height:9px;border-radius:50%;background:${color};` +\n      `display:inline-block\"></span>${name}</span>`\
            \ +\n      `<strong style=\"margin-left:14px\">${Math.round(value).toLocaleString()} W</strong></div>`);\n  }\n\
            \  if (!entries.length) return '';\n  const when = new Date(time).toLocaleString(undefined, {\n    month: 'short',\
            \ day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false\n  });\n  return `<div style=\"padding:10px\
            \ 12px;background:var(--ha-card-background,` +\n    `var(--card-background-color));color:var(--primary-text-color);`\
            \ +\n    `border:1px solid var(--divider-color);border-radius:8px;min-width:185px\">` +\n    `<div style=\"font-weight:600;margin-bottom:6px\"\
            >${escape(when)}</div>` +\n    `${entries.join('')}</div>`;\n}"
        xaxis:
          type: datetime
          labels:
            format: HH:mm
        yaxis:
          decimalsInFloat: 0
          title:
            text: W
        stroke:
          curve: straight
          dashArray:
          - 0
          - 0
          - 0
          - 0
          - 5
          - 8
          width:
          - 1
          - 1
          - 1
          - 2
          - 2
          - 1
        fill:
          opacity:
          - 0.82
          - 0.86
          - 0.9
          - 1
          - 1
          - 1
