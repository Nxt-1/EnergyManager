      - entity: sensor.energy_manager_plan_day_1
        name: Solar
        type: area
        stroke_width: 1
        extend_to: false
        show:
          legend_value: false
          in_header: false
        data_generator: "// Share one 5-minute statistics query across all five power series.\n// EnergyManager power sensors\
          \ have state_class=measurement, so HA compiles\n// short-term means. Never download hundreds of thousands of raw\
          \ state changes.\nif (typeof window.energyManagerPowerStatsV220?.getPoints !== 'function') {\n  window.energyManagerPowerStatsV220\
