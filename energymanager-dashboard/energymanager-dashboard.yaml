              \ minSoc = Number(\n    states['number.garage_gx_device_ess_min_soc_limit']?.state ?? 20\n  );\n  const ratio\
              \ = Math.max(\n    0,\n    Math.min(\n      1,\n      (soc - minSoc) / Math.max(1, 100 - minSoc)\n    )\n  );\n\
              \  const hue = Math.round(ratio * 120);\n  const fill = `hsla(${hue}, 72%, 45%, 0.30)`;\n\n  return `linear-gradient(\n\
              \    to right,\n    ${fill} 0%,\n    ${fill} ${soc}%,\n    var(--ha-card-background, var(--card-background-color))\
