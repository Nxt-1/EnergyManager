- title: Performance
  path: performance
  icon: mdi:chart-line
  cards:
  - type: markdown
    content: '## Recorded actual operation

      This initial view shows actual Home Assistant history. Historical plan-versus-actual overlays require an InfluxDB
      3 history-query bridge and verification of stored snapshots.'
  - type: history-graph
    title: Actual power — last 24 hours
    hours_to_show: 24
    refresh_interval: 60
    entities:
    - sensor.energy_manager_grid_power
    - sensor.energy_manager_house_load_power
    - sensor.energy_manager_pv_total_power
    - sensor.energy_manager_ess_power
    - sensor.energy_manager_ev_charging_power
  - type: history-graph
    title: ESS / EV SoC — last 48 hours
    hours_to_show: 48
    refresh_interval: 60
    entities:
    - sensor.energy_manager_ess_soc
    - sensor.energy_manager_ev_soc
  - type: entities
    title: Forecast quality and persistence
