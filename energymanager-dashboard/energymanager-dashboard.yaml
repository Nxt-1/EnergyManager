# Native Home Assistant dashboard (YAML mode)
# Requires ApexCharts Card installed via HACS.
title: EnergyManager
views:
- title: Overview
  path: overview
  icon: mdi:view-dashboard
  cards:
  - type: markdown
    content: '## EnergyManager · Live overview

      Positive ESS power means **discharging**; positive grid power means **importing**. DC PV charges the ESS and must not
      be counted twice as AC production.'
  - type: grid
    columns: 3
    square: false
    cards:
    - type: tile
      entity: sensor.energy_manager_grid_power
      name: Grid net
    - type: tile
      entity: sensor.energy_manager_pv_total_power
      name: PV combined
    - type: tile
      entity: sensor.energy_manager_house_load_power
      name: House load
    - type: tile
      entity: sensor.energy_manager_ess_soc
      name: ESS SoC
    - type: tile
      entity: sensor.energy_manager_ev_soc
      name: EV SoC
    - type: tile
      entity: sensor.energy_manager_ev_charging_power
      name: EV charging
  - type: entities
    title: Controller
    show_header_toggle: false
    entities:
    - sensor.energy_manager_control_health
    - sensor.energy_manager_fast_dispatch_status
    - sensor.energy_manager_ess_control_status
    - sensor.energy_manager_ev_control_status
    - sensor.energy_manager_shadow_plan_status
    - sensor.energy_manager_notification_status
  - type: custom:apexcharts-card
    header:
      show: true
      title: Next 24 h · Planned AC-side power
      show_states: false
    graph_span: 24h
    span:
      start: minute
    now:
      show: true
      label: Now
    update_interval: 1min
    apex_config:
      chart:
        height: 300
      legend:
        show: true
        showForSingleSeries: true
      tooltip:
        shared: true
      xaxis:
        type: datetime
      yaxis:
        decimalsInFloat: 0
    series:
    - entity: sensor.energy_manager_plan_day_1
      name: Load incl. EV
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.load_w)]);
      color: '#909090'
    - entity: sensor.energy_manager_plan_day_1
      name: AC PV
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.pv_ac_w)]);
      color: '#f6a500'
    - entity: sensor.energy_manager_plan_day_1
      name: ESS discharge +
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ess_w)]);
      color: '#2966c7'
    - entity: sensor.energy_manager_plan_day_1
      name: Grid import +
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.grid_w)]);
      color: '#bc4e7d'
  - type: custom:apexcharts-card
    header:
      show: true
      title: Next 24 h · Planned battery SoC
      show_states: false
    graph_span: 24h
    span:
      start: minute
    now:
      show: true
      label: Now
    update_interval: 1min
    apex_config:
      chart:
        height: 300
      legend:
        show: true
        showForSingleSeries: true
      tooltip:
        shared: true
      xaxis:
        type: datetime
      yaxis:
        decimalsInFloat: 0
    series:
    - entity: sensor.energy_manager_plan_day_1
      name: ESS SoC
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ess_soc)]);
      color: '#2e8b57'
    - entity: sensor.energy_manager_plan_day_1
      name: EV SoC
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ev_soc)]);
      color: '#8b5aa9'
    yaxis:
    - min: 0
      max: 100
      decimals: 0
  - type: entities
    title: Next 24 h forecast
    show_header_toggle: false
    entities:
    - sensor.energy_manager_shadow_plan_next_24_hours_grid_import_energy
    - sensor.energy_manager_shadow_plan_next_24_hours_net_deficit_energy
    - sensor.energy_manager_background_load_forecast_next_24_hours_energy
    - sensor.energy_manager_pv_forecast_tomorrow_energy
