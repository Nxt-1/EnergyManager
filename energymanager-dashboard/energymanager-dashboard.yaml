            const imp = states[''sensor.energy_manager_grid_import_energy_today'']?.state;

            const exp = states[''sensor.energy_manager_grid_export_energy_today'']?.state;

            const fmt = v => Number.isFinite(Number(v)) && ![''unknown'',''unavailable'',''''].includes(v) ? Number(v).toFixed(2)
            : ''—'';

            return `→ ${fmt(imp)} kWh<br>← ${fmt(exp)} kWh`;

            ]]]'
