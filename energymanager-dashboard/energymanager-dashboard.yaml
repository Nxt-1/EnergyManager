# Native Home Assistant dashboard (YAML mode)
# Requires ApexCharts Card installed via HACS.
title: EnergyManager
views:
- title: Overview
  path: overview
  icon: mdi:view-dashboard
  cards:
  - type: custom:energymanager-timeline-card
    entity: sensor.energy_manager_plan_timeline
    title: Scheduled tasks · next 24 h
    hours: 24
  - type: grid
    columns: 3
    square: false
    cards:
    - type: tile
      entity: sensor.energy_manager_grid_power
      name: Grid net
    - type: tile
      entity: sensor.energy_manager_pv_total_power
      name: PV combined
    - type: tile
      entity: sensor.energy_manager_house_load_power
      name: House load
    - type: tile
      entity: sensor.energy_manager_ess_soc
      name: ESS SoC
    - type: tile
      entity: sensor.energy_manager_ev_soc
      name: EV SoC
    - type: tile
      entity: sensor.energy_manager_ev_charging_power
      name: EV charging
  - type: custom:apexcharts-card
    header:
      show: true
      title: Planned power · next 24 h
      show_states: false
    graph_span: 24h
    span:
      start: minute
    now:
      show: true
      label: Now
    update_interval: 1min
    apex_config:
      chart:
        height: 240
        toolbar:
          show: false
      grid:
        borderColor: var(--divider-color)
      legend:
        show: true
        showForSingleSeries: true
      tooltip:
        shared: true
      xaxis:
        type: datetime
      yaxis:
        decimalsInFloat: 0
    series:
    - entity: sensor.energy_manager_plan_day_1
      name: Load
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.load_w)]);
    - entity: sensor.energy_manager_plan_day_1
      name: AC PV
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.pv_ac_w)]);
    - entity: sensor.energy_manager_plan_day_1
      name: ESS
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ess_w)]);
    - entity: sensor.energy_manager_plan_day_1
      name: Grid
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.grid_w)]);
    - entity: sensor.energy_manager_plan_day_1
      name: Solar expected
      type: line
      stroke_width: 2
      curve: smooth
      show:
        legend_value: false
        in_header: false
      data_generator: >-
        return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.pv_ac_w) + Number(p.pv_dc_w)]);
    - entity: sensor.energy_manager_plan_day_1
      name: Peak (15 min)
      type: line
      stroke_width: 1
      show:
        legend_value: false
        in_header: false
      data_generator: >-
        const peak = Number(hass.states['sensor.energy_manager_capacity_tariff_status']?.attributes?.observed_peak_kw);
        if (!Number.isFinite(peak) || peak <= 0) return [];
        return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), peak * 1000]);
  - type: custom:apexcharts-card
    header:
      show: true
      title: Planned energy · next 24 h
      show_states: false
    graph_span: 24h
    span:
      start: minute
    now:
      show: true
    update_interval: 1min
    apex_config:
      chart:
        height: 230
      legend:
        show: true
      tooltip:
        shared: true
    series:
    - entity: sensor.energy_manager_plan_day_1
      name: Grid import
      type: line
      stroke_width: 2
      show:
        legend_value: false
        in_header: false
      data_generator: >-
        let kwh = 0;
        return (entity.attributes.intervals || []).map(p => { kwh += Math.max(0, Number(p.grid_w)) * 0.25 / 1000; return [new Date(p.start).getTime(), +kwh.toFixed(3)]; });
    - entity: sensor.energy_manager_plan_day_1
      name: Grid export
      type: line
      stroke_width: 2
      show:
        legend_value: false
        in_header: false
      data_generator: >-
        let kwh = 0;
        return (entity.attributes.intervals || []).map(p => { kwh += Math.max(0, -Number(p.grid_w)) * 0.25 / 1000; return [new Date(p.start).getTime(), +kwh.toFixed(3)]; });
    - entity: sensor.energy_manager_plan_day_1
      name: Solar expected
      type: line
      stroke_width: 2
      show:
        legend_value: false
        in_header: false
      data_generator: >-
        let kwh = 0;
        return (entity.attributes.intervals || []).map(p => { kwh += (Number(p.pv_ac_w) + Number(p.pv_dc_w)) * 0.25 / 1000; return [new Date(p.start).getTime(), +kwh.toFixed(3)]; });
  - type: custom:apexcharts-card
    header:
      show: true
      title: Battery SoC · next 24 h
      show_states: false
    graph_span: 24h
    span:
      start: minute
    now:
      show: true
      label: Now
    update_interval: 1min
    apex_config:
      chart:
        height: 240
        toolbar:
          show: false
      grid:
        borderColor: var(--divider-color)
      legend:
        show: true
        showForSingleSeries: true
      tooltip:
        shared: true
      xaxis:
        type: datetime
      yaxis:
        decimalsInFloat: 0
    series:
    - entity: sensor.energy_manager_plan_day_1
      name: ESS SoC
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ess_soc)]);
    - entity: sensor.energy_manager_plan_day_1
      name: EV SoC
      type: line
      stroke_width: 2
      extend_to: end
      show:
        legend_value: false
        in_header: false
      data_generator: return (entity.attributes.intervals || []).map(p => [new Date(p.start).getTime(), Number(p.ev_soc)]);
    yaxis:
    - min: 0
      max: 100
      decimals: 0
  - type: entities
    title: Next 24 h
    show_header_toggle: false
    entities:
    - entity: sensor.energy_manager_shadow_plan_next_24_hours_grid_import_energy
      name: Grid import
    - entity: sensor.energy_manager_shadow_plan_next_24_hours_net_deficit_energy
      name: Net deficit
    - entity: sensor.energy_manager_background_load_forecast_next_24_hours_energy
      name: Background load
    - entity: sensor.energy_manager_pv_forecast_tomorrow_energy
      name: Tomorrow's PV
