          \ buckets[i].size === 0);\n        if (stats.missingSensors.length) {\n          console.warn('EnergyManager 5-minute\
          \ statistics missing:', stats.missingSensors);\n        }\n        const samples = [];\n        for (let t = Math.ceil(startMs\
          \ / SAMPLE_MS) * SAMPLE_MS; t < cutoff; t += SAMPLE_MS) {\n          samples.push([t, ...buckets.map(values => values.get(t)\
          \ ?? null)]);\n        }\n        stats.lastDurationMs = Math.round(performance.now() - t0);\n        stats.lastSamples\
          \ = samples.length;\n        return samples;\n      })();\n      // Cache in-flight and completed requests for the\
          \ current 5-minute boundary.\n      requests.clear();\n      requests.set(key, task);\n      task.catch(() => {\
          \ if (requests.get(key) === task) requests.delete(key); });\n      return task;\n    }\n\n    return {\n      stats,\n\
          \      async getPoints(hass, start, end, sources) {\n        const startMs = start.getTime();\n        const finish\
          \ = end.getTime();\n        const cutoff = Math.floor(Math.min(Date.now(), finish) / SAMPLE_MS) * SAMPLE_MS;\n \
          \       if (cutoff <= startMs) return [];\n        const columns = sources.map(id => indices.get(id));\n       \
          \ if (columns.some(i => i === undefined)) throw new Error('Unrecognized power source');\n        const samples =\
          \ await load(hass, startMs, cutoff);\n        return samples.filter(row => columns.every(i => row[i + 1] !== null))\n\
          \          .map(row => [row[0], columns.reduce((total, i) => total + row[i + 1], 0)]);\n      }\n    };\n  })();\n\
          }\n\nconst sources = ['sensor.energy_manager_background_load_power'];\nconst keys = ['background_w'];\nconst now\
          \ = Date.now();\nconst begin = start.getTime();\nconst finish = end.getTime();\nlet points = [];\n\n// The five\
          \ power series share one Recorder query and one 5-minute history cache.\ntry {\n  points = await window.energyManagerPowerStatsV220.getPoints(hass,\
          \ start, end, sources);\n} catch (error) {\n  console.warn('EnergyManager Background history unavailable:', error);\n\
          }\n\n// Append fresh live power independently of the Recorder snapshot.\nconst current = sources.map(source => hass.states[source]);\n\
          if (begin <= now && now <= finish && current.every(s =>\n  s && !['unknown', 'unavailable'].includes(String(s.state))\
          \ && Number.isFinite(Number(s.state)) &&\n  Number.isFinite(Date.parse(s.last_updated || '')) && now - Date.parse(s.last_updated)\
          \ < 120000)) {\n  points.push([now, current.reduce((sum, s) => sum + Number(s.state), 0)]);\n}\n\n// Forecast updates\
          \ independently of the cached history, using current MILP intervals.\nfor (const interval of entity.attributes.intervals\
          \ || []) {\n  const time = Date.parse(interval.start);\n  const values = keys.map(key => Number(key === 'background_w'\n\
          \    ? (interval.background_w ?? interval.load_w) : interval[key]));\n  if (Number.isFinite(time) && time > now\
          \ && time <= finish && values.every(Number.isFinite)) {\n    points.push([time, values.reduce((sum, value) => sum\
          \ + value, 0)]);\n  }\n}\nreturn [...new Map(points.map(point => [point[0], point])).values()]\n  .sort((a, b) =>\
          \ a[0] - b[0]);"
