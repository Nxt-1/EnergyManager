- title: Performance
  path: performance
  icon: mdi:chart-line
  cards:
  - type: markdown
    content: '## Recorded actual operation

      This initial view shows actual Home Assistant history. Historical plan-versus-actual overlays require an InfluxDB 3
      history-query bridge and verification of stored snapshots.'
  - type: history-graph
    title: Actual power — last 24 hours
    hours_to_show: 24
    refresh_interval: 60
    entities:
    - sensor.energy_manager_grid_power
    - sensor.energy_manager_house_load_power
    - sensor.energy_manager_pv_total_power
    - sensor.energy_manager_ess_power
    - sensor.energy_manager_ev_charging_power
  - type: history-graph
    title: ESS / EV SoC — last 48 hours
    hours_to_show: 48
    refresh_interval: 60
    entities:
    - sensor.energy_manager_ess_soc
    - sensor.energy_manager_ev_soc
  - type: entities
    title: Forecast quality and persistence
    show_header_toggle: false
    entities:
    - sensor.energy_manager_background_load_backtest
    - sensor.energy_manager_database_status
    - sensor.energy_manager_input_health
    - sensor.energy_manager_plan_cost_status
  - type: markdown
    content: '**Not yet available:** auditable historical plan comparisons, actual-versus-baseline cost, and 15-minute peak
      attribution. These will need data-access and calculation work rather than invented dashboard values.'
- title: Diagnostics
  path: diagnostics
  icon: mdi:clipboard-text-clock
  cards:
  - type: entities
    title: Live control health
    entities:
    - sensor.energy_manager_control_health
    - sensor.energy_manager_ess_control_status
    - sensor.energy_manager_ev_control_status
    - sensor.energy_manager_notification_status
    - sensor.energy_manager_fast_dispatch_status
  - type: markdown
    title: Recent notification events
    content: >-
      {% set events = state_attr('sensor.energy_manager_notification_status', 'recent_events') or [] %}
      {% if not events %}
      No events recorded since the current EnergyManager startup.
      {% else %}
      | Time (UTC) | Event | Health | Reason |
      |:--|:--|:--|:--|
      {% for e in events | reverse %}
      | {{ e.time[:19] }} | {{ e.event }} | {{ e.health }} | {{ (e.reason or '-') | replace('|','/') }} |
      {% endfor %}
      {% endif %}
  - type: markdown
    content: >-
      The list shows the last 30 notification-manager events from the running add-on,
      including suppressed/pending alerts. It is not yet a durable historical event database.
      Short-lived health changes remain visible here without sending phone notifications.
