name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            energymanager/requirements.lock
            energymanager/requirements-dev.lock
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check energymanager/src energymanager/tests energymanager/tools

      - name: Check types and release entry point
        run: |
          mypy energymanager/src/energymanager
          python -m energymanager --version

      - name: Run tests
        run: pytest

      - name: Check dashboard JavaScript
        run: |
          node --check energymanager/src/energymanager/assets/app.js
          node --check energymanager/src/energymanager/assets/native-dashboard.js
          node --check energymanager/src/energymanager/assets/application-view.js
          node --check energymanager/src/energymanager/assets/native-live.js
          node --check energymanager/src/energymanager/assets/graph-history.js
          node --check energymanager/src/energymanager/assets/graph-cursor.js
          node --check energymanager/src/energymanager/assets/settings.js
          node --check energymanager/src/energymanager/assets/display.js
          node --check energymanager/src/energymanager/assets/date-time.js
          node --check energymanager/src/energymanager/assets/datetime-picker.js
          node --check energymanager/src/energymanager/assets/ev-schedule.js
          node --test energymanager/tools/frontend.test.mjs
          node --check energymanager/src/energymanager/assets/ha-card.js
          node --check energymanager-dashboard/energymanager-card.js

      - name: Verify configured local application
        working-directory: energymanager
        run: python tools/offline_e2e.py

      - name: Verify routed calendar application
        working-directory: energymanager
        run: python tools/offline_e2e.py --routing-fixture

      - name: Build Python package
        run: python -m build --no-isolation energymanager

      - name: Build container
        run: |
          docker build \
            --build-arg BUILD_VERSION=ci \
            --build-arg BUILD_ARCH=amd64 \
            --tag energymanager:ci \
            energymanager
