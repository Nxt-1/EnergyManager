name: Publish app image

on:
  push:
    branches:
      - main
    paths:
      - energymanager/config.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/nxt-1/energymanager

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            energymanager/requirements.lock
            energymanager/requirements-dev.lock
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check energymanager/src energymanager/tests energymanager/tools

      - name: Run tests
        run: pytest

      - name: Check V4 entry point and assets
        run: |
          python -m energymanager --version
          node --check energymanager/src/energymanager/assets/app.js
          node --check energymanager/src/energymanager/assets/settings.js
          node --check energymanager/src/energymanager/assets/display.js
          node --check energymanager/src/energymanager/assets/date-time.js
          node --check energymanager/src/energymanager/assets/datetime-picker.js
          node --check energymanager/src/energymanager/assets/ev-schedule.js
          node --test energymanager/tools/frontend.test.mjs
          node --check energymanager-dashboard/energymanager-card.js

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' energymanager/config.yaml | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "Could not read version from energymanager/config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 image
        uses: docker/build-push-action@v7
        with:
          context: ./energymanager
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
