name: Publish InfluxDB 3 HA app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "influxdb3/**"
      - ".github/workflows/publish-influxdb3.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(grep '^version:' influxdb3/config.yaml | head -n1 | cut -d '"' -f2)"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./influxdb3
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
          tags: |
            ghcr.io/nxt-1/energymanager-influxdb3:${{ steps.version.outputs.version }}
            ghcr.io/nxt-1/energymanager-influxdb3:latest
